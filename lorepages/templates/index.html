{% extends "base.html" %}
{% block content %}
{% if metadata %}
<div class="campaign-meta">
    <dl class="meta-list">
        {% for key, value in metadata.items() %}
        <dt>{{ key }}</dt>
        <dd>{{ value }}</dd>
        {% endfor %}
    </dl>
</div>
{% endif %}
{{ page_content }}
{% endblock %}
