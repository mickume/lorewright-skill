<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page_title }} — {{ campaign_title }}</title>
    <link rel="stylesheet" href="{{ base_url }}assets/theme/theme.css">
</head>
<body class="mode-{{ mode }}">
    <button class="sidebar-toggle" aria-label="Toggle navigation">&#9776;</button>
    <div class="site-container">
        <nav class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h1 class="campaign-name">{{ campaign_title }}</h1>
                <span class="build-mode">{{ mode | upper }}</span>
            </div>
            <ul class="nav-list">
                {% for item in navigation %}
                <li class="nav-item{% if item.active %} active{% endif %}">
                    <a href="{{ base_url }}{{ item.slug }}.html">{{ item.title }}</a>
                    {% if item.children %}
                    <ul class="nav-children">
                        {% for child in item.children %}
                        <li class="nav-child{% if child.active %} active{% endif %}">
                            <a href="{{ base_url }}{{ child.slug }}.html">{{ child.title }}</a>
                        </li>
                        {% endfor %}
                    </ul>
                    {% endif %}
                </li>
                {% endfor %}
            </ul>
        </nav>
        <main class="content">
            <article>
                {% block content %}{% endblock %}
            </article>
        </main>
    </div>
    <footer>
        <p>Built with <a href="https://github.com/mickume/lorewright-skill">lorepages</a></p>
    </footer>
    <script>
    document.querySelector('.sidebar-toggle').addEventListener('click', function() {
        document.getElementById('sidebar').classList.toggle('open');
    });
    </script>
</body>
</html>
